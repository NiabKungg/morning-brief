[project]
name = "mib"
version = "1.0.0"
description = "Morning Intelligence Brief: Pi 4 crawler + Pi 5 LFM3 brain that writes a daily executive summary"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
]

[project.optional-dependencies]
hub = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
worker = [
    "feedparser>=6.0.11",
    "lxml>=5.3",
    "lxml_html_clean>=0.4",
    "trafilatura>=2.0",
    "icalendar>=6.0",
    "recurring-ical-events>=3.3",
    "playwright>=1.48",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
